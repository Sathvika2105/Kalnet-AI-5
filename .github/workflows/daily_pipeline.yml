name: Daily Email Pipeline
on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline on Render
        run: |
          response=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_URL }}/api/trigger-pipeline" \
            -H "x-pipeline-secret: ${{ secrets.PIPELINE_TRIGGER_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Response code: $response"
          echo "Response body: $(cat response.txt)"
          if [ "$response" != "200" ]; then
            echo "Pipeline trigger failed"
            exit 1
          fi
          echo "Pipeline triggered successfully on Render"