name: Daily Email Pipeline

on:
  schedule:
    - cron: '30 3 * * *'  # Runs every day at 9:00 AM IST
  workflow_dispatch:        # Lets you run it manually too

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create service account file
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/service_account.json

      - name: Run pipeline
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RISHAV_PHONE: ${{ secrets.RISHAV_PHONE }}
          ULTRAMSG_INSTANCE_ID: ${{ secrets.ULTRAMSG_INSTANCE_ID }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
        run: python pipeline/run.py